<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SongSense — AI Music for Your Moment</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="bg-blobs" aria-hidden="true">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <div class="app-shell">

    <nav class="topnav">
      <div class="nav-brand">
        <span class="brand-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="12" r="10" stroke="#1DB954" stroke-width="2"/>
            <circle cx="12" cy="12" r="3" fill="#1DB954"/>
            <path d="M12 2 Q14 7 12 12 Q10 17 12 22" stroke="#1DB954" stroke-width="1.5" fill="none"/>
            <path d="M2 12 Q7 14 12 12 Q17 10 22 12" stroke="#1DB954" stroke-width="1.5" fill="none"/>
          </svg>
        </span>
        <span class="brand-name">SongSense</span>
      </div>
      <div class="nav-pills">
        <span class="pill pill-active">AI Picks</span>
        <span class="pill">History</span>
        <span class="pill">Moods</span>
      </div>
      <div id="locationStatus" class="location-badge">
        <span class="loc-dot"></span>
        <span id="locationText">No location</span>
      </div>
    </nav>

    <div class="main-layout">

      <section class="input-panel">

        <div class="panel-heading">
          <h1>What's the vibe?</h1>
          <p>Tell me your mood, activity, or just how you feel.</p>
        </div>

        <div class="chat-input-wrap">
          <textarea
            id="message"
            class="chat-input"
            placeholder="e.g. something chill for this rainy evening…"
            rows="3"
            maxlength="300"
          ></textarea>
          <div class="char-count"><span id="charCount">0</span>/300</div>
        </div>

        <div class="quick-picks">
          <span class="qp-label">Quick picks</span>
          <div class="qp-chips">
            <button class="chip" data-text="I'm feeling happy and want upbeat music">😄 Happy</button>
            <button class="chip" data-text="suggest something chill for studying">📚 Focus</button>
            <button class="chip" data-text="I'm feeling sad, play something emotional">😢 Sad</button>
            <button class="chip" data-text="party music, let's dance!">🎉 Party</button>
            <button class="chip" data-text="suggest a romantic song for tonight">💕 Romantic</button>
            <button class="chip" data-text="music for this weather">🌤 Weather</button>
          </div>
        </div>

        <div class="location-row">
          <button id="gpsBtn" class="loc-btn loc-primary">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
            Use GPS
          </button>
          <div class="city-wrap">
            <input id="cityInput" type="text" class="city-input" placeholder="Or enter city…" />
            <button id="cityBtn" class="loc-btn loc-secondary">Go</button>
          </div>
        </div>

        <button id="recommendBtn" class="recommend-btn" disabled>
          <span class="btn-icon">✦</span>
          <span class="btn-label">Find My Song</span>
          <span class="btn-spinner" aria-hidden="true"></span>
        </button>

      </section>

      <section class="result-panel">

        <div id="nowPlayingCard" class="now-playing-card state-empty">

          <div class="np-empty">
            <div class="vinyl-idle">
              <div class="vinyl-ring r1"></div>
              <div class="vinyl-ring r2"></div>
              <div class="vinyl-ring r3"></div>
              <div class="vinyl-center"></div>
            </div>
            <p>Your track will appear here</p>
          </div>

          <div class="np-loaded" hidden>
            <div class="np-top">
              <div class="np-art">
                <div class="vinyl-spin">
                  <div class="vinyl-ring r1"></div>
                  <div class="vinyl-ring r2"></div>
                  <div class="vinyl-ring r3"></div>
                  <div class="vinyl-center"></div>
                </div>
              </div>
              <div class="np-meta">
                <div class="np-label">Now Playing</div>
                <h2 id="songTitle" class="np-title">—</h2>
                <p id="songArtist" class="np-artist">—</p>
                <div class="np-tags">
                  <span id="intentTag" class="tag tag-intent">—</span>
                  <span id="moodTag" class="tag tag-mood">—</span>
                </div>
              </div>
            </div>

            <div class="waveform" aria-hidden="true">
              <span class="bar"></span><span class="bar"></span><span class="bar"></span>
              <span class="bar"></span><span class="bar"></span><span class="bar"></span>
              <span class="bar"></span><span class="bar"></span><span class="bar"></span>
              <span class="bar"></span><span class="bar"></span><span class="bar"></span>
              <span class="bar"></span><span class="bar"></span><span class="bar"></span>
              <span class="bar"></span><span class="bar"></span><span class="bar"></span>
              <span class="bar"></span><span class="bar"></span>
            </div>

            <div class="transport">
              <button class="transport-btn" aria-label="Shuffle">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 3h5v5M4 20l16-16M16 21h5v-5M4 4l8 8"/></svg>
              </button>
              <button class="transport-btn" aria-label="Previous">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M19 20L9 12l10-8v16zM5 4h2v16H5z"/></svg>
              </button>
              <button class="transport-btn transport-play" aria-label="Play/Pause">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M5 3l14 9-14 9V3z"/></svg>
              </button>
              <button class="transport-btn" aria-label="Next">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M5 4l10 8-10 8V4zM17 4h2v16h-2z"/></svg>
              </button>
              <button class="transport-btn" id="spotifySearchBtn" aria-label="Find on Spotify">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.477 2 2 6.477 2 12s4.477 10 10 10 10-4.477 10-10S17.523 2 12 2zm4.586 14.424a.622.622 0 01-.857.207c-2.348-1.435-5.304-1.76-8.785-.964a.622.622 0 01-.277-1.215c3.809-.87 7.076-.496 9.712 1.115a.622.622 0 01.207.857zm1.223-2.722a.779.779 0 01-1.072.257c-2.687-1.652-6.785-2.13-9.965-1.166a.779.779 0 01-.973-.519.779.779 0 01.519-.972c3.632-1.102 8.147-.568 11.234 1.328a.779.779 0 01.257 1.072zm.105-2.835C14.692 8.95 9.375 8.775 6.297 9.71a.935.935 0 11-.543-1.79c3.533-1.072 9.404-.865 13.115 1.338a.935.935 0 01-.955 1.609z"/></svg>
              </button>
            </div>

            <a id="spotifyLink" class="spotify-open" href="#" target="_blank" rel="noopener">
              Open in Spotify
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6M15 3h6v6M10 14L21 3"/></svg>
            </a>
          </div>

        </div>
        <div class="waveform" aria-hidden="true">
        </div>

        <div id="spotifyEmbedWrap" class="spotify-embed" hidden></div>

        <div class="transport">
        </div>

        <div id="weatherCard" class="weather-card state-empty">
          <div class="wc-empty">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#4B5563" stroke-width="1.5"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/></svg>
            <span>Weather loads after location is set</span>
          </div>
          <div class="wc-loaded" hidden>
            <div class="wc-icon" id="weatherIcon">🌤</div>
            <div class="wc-info">
              <div id="weatherCity" class="wc-city">—</div>
              <div id="weatherDesc" class="wc-desc">—</div>
            </div>
            <div id="weatherTemp" class="wc-temp">—°C</div>
          </div>
        </div>

        <div id="statusMsg" class="status-msg" aria-live="polite"></div>

      </section>

    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
